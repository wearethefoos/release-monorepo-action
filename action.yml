name: 'Release Monorepo Action'
description:
  'Create releases, prereleases, and changelogs based on conventional commits to
  multiple release targets.'
author: wearethefoos

branding:
  icon: package
  color: blue

inputs:
  token:
    description: 'GitHub token for authentication'
    required: true
  root-dir:
    description: 'The root directory to use for the release'
    required: false
    default: '.'
  manifest-file:
    description: 'The manifest file to use, relative to the root-dir'
    required: true
    default: '.release-manifest.json'
  create-prereleases:
    description: 'Whether to create prereleases from pull requests'
    required: false
    default: 'false'
  prerelease-label:
    description: 'The PR label to use for prereleases'
    required: false
    default: 'Prerelease'
  release-target:
    description:
      'The target environment to release to (e.g. main, canary, aws). Cannot be
      "latest"'
    required: false
    default: 'main'
  overwrite-existing-tags:
    description:
      'Whether to force-move a release tag that already exists to the current
      commit instead of failing the run. Defaults to "true" to match this
      action''s pre-2.x behavior. DEPRECATED: this default will change to
      "false" in a future release, after which a tag collision will fail the run
      unless this is explicitly set to "true". Set it explicitly now to avoid a
      behavior change later.'
    required: false
    default: 'true'
  indentation:
    description:
      'The indentation to use for json files, can be "tab" or a number of
      spaces. Default is 2 spaces.'
    required: false
    default: '2'
  git-user-name:
    description:
      'The git user name to use for release commits created by this action'
    required: false
    default: 'github-actions[bot]'
  git-user-email:
    description:
      'The git user email to use for release commits created by this action'
    required: false
    default: '41898282+github-actions[bot]@users.noreply.github.com'

outputs:
  releases-created:
    description: 'Whether one or more releases were created'
  version:
    description: 'The version that was released'
  versions:
    description: 'The versions that were released (e.g. from a monorepo)'
  prerelease:
    description: 'Whether the release or releases were prereleases'

runs:
  using: node24
  main: dist/index.js
